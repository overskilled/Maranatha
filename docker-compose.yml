# ============================================================
# Maranatha Le Juste Prix
#
#   cp .env.example .env     puis compléter
#   docker compose up -d --build
#
# Les données vivent dans le volume « donnees » : la base, les fichiers
# d'import, et les photos tant que Cloudflare R2 n'est pas configuré.
# Avec R2, seule la base reste locale — mais elle, il faut la sauvegarder.
# ============================================================

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      DATA_DIR: /data
    volumes:
      - donnees:/data
    expose:
      - "4321"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4321/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Les photos du catalogue, servies sans passer par Node.
      - donnees:/data:ro

volumes:
  donnees:
