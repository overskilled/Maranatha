# ============================================================
# Maranatha Le Juste Prix — proxy en façade
#
# nginx sert les photos du catalogue depuis le volume de données
# et transmet tout le reste au serveur Node, qui sait déjà servir
# ses propres fichiers de build avec les bons en-têtes de cache.
#
# C'est aussi ici que se branche le certificat TLS (certbot).
# ============================================================

upstream maranatha_app {
    server app:4321;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    charset utf-8;
    server_tokens off;

    # Une photo de téléphone peut peser lourd avant redimensionnement.
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Photos du catalogue ----------
    # Servies directement : chaque nom de fichier est unique, donc
    # le cache peut durer sans risque de servir une vieille image.
    location /media/ {
        alias /data/uploads/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- Tout le reste ----------
    location / {
        proxy_pass http://maranatha_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Un import de plusieurs milliers de lignes prend son temps.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Les dépôts de fichiers passent sans être mis en tampon.
        proxy_request_buffering off;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
