server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # HTML and 404s should always be revalidated
    expires -1;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Astro's default "directory" build format:
    #   /la-maison  ->  /la-maison/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fingerprinted build assets (CSS/JS) never change — cache forever
    location /_astro/ {
        expires 1y;
        access_log off;
    }

    # Versioned WebP renditions are also safe to cache long-term
    location /images/ {
        expires 30d;
    }

    location /fonts/ {
        expires 1y;
        access_log off;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
